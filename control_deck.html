<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>SC 컨트롤 덱</title>
<style>
  :root { --bg:#070b12; --panel:#0e1620; --line:#1c2836; --fg:#eef4fa;
          --dim:#7e93a6; --accent:#46c8e6; --accent-2:#7fdcf2; --accent-dim:#164b5e;
          --amber:#f0a86e; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; color:var(--fg);
         background:radial-gradient(1100px 520px at 50% -120px,#10202f 0%,#070b12 58%) fixed #070b12;
         font-family:'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
         touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  header { display:flex; align-items:center; justify-content:space-between;
           padding:12px 16px; border-bottom:1px solid rgba(120,180,210,.12);
           background:linear-gradient(180deg,rgba(20,34,48,.5),rgba(10,16,24,0)); }
  header h1 { font-size:15px; margin:0; letter-spacing:3px; font-weight:700;
              color:var(--accent-2); text-shadow:0 0 14px rgba(70,200,230,.45); }
  #settingsOpen { border:1px solid rgba(70,200,230,.35);
                  background:linear-gradient(180deg,#16303f,#102433);
                  color:#b4e5ec; border-radius:999px; padding:7px 14px; font-size:13px; cursor:pointer; }
  #focusBadge { font-size:12px; color:var(--dim); }
  #focusBadge.off { color:#ff6b6b; }
  #tabs { display:flex; gap:8px; padding:10px 14px; }
  .tab { flex:1; text-align:center; padding:9px 0; font-size:14px; color:var(--dim);
         background:rgba(18,28,40,.6); border:1px solid rgba(120,170,200,.14);
         border-radius:999px; cursor:pointer;
         transition:background .15s, color .15s, box-shadow .15s, border-color .15s; }
  .tab.on { color:#04222c; background:linear-gradient(180deg,#6fdcf5,#3ab9d8);
            border-color:transparent; font-weight:700;
            box-shadow:0 0 18px rgba(70,200,230,.35), inset 0 1px 0 rgba(255,255,255,.35); }
  #deckStatus { margin:10px 14px; padding:10px 12px; font-size:12px;
    border:1px solid rgba(214,170,90,.35); background:linear-gradient(180deg,#241f14,#1a1710);
    color:#e7c88d; border-radius:12px; line-height:1.5; }
  #deckStatus.ready { background:linear-gradient(180deg,#10271f,#0c1c17);
                      border-color:rgba(90,200,180,.30); color:#a1d8d3; }
  #common { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px;
            padding:2px 14px 12px; border-bottom:1px solid rgba(120,180,210,.10); }
  #common .btn { min-height:64px; }
  #common .lbl { font-size:14px; }
  #pageHeading { display:flex; align-items:center; justify-content:space-between; padding:12px 14px 0; gap:8px; }
  #pageName { margin:0; font-size:20px; font-weight:700; letter-spacing:.5px; }
  #pageDescription { margin:5px 0 0; font-size:12px; color:var(--dim); }
  #pageCount { flex-shrink:0; font-size:11px; color:var(--dim); font-variant-numeric:tabular-nums; }
  #grid { padding:0 14px 18px; }
  .group-title { font-size:11px; color:#9fb6c9; letter-spacing:2px; margin:18px 0 9px;
                 font-weight:600; padding-left:10px; border-left:2px solid rgba(70,200,230,.55); }
  .group-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
  .group.caution-zone { border:1px solid rgba(224,150,110,.28);
    background:linear-gradient(180deg,rgba(50,30,20,.35),rgba(24,16,12,.35));
    padding:0 12px 12px; margin-top:18px; border-radius:14px; }
  .caution-zone .group-title { color:#dcb298; margin-top:12px; border-left-color:rgba(240,168,110,.6); }
  button { font:inherit; color:inherit; touch-action:none; }
  .btn { position:relative; overflow:hidden;
         background:linear-gradient(160deg,#1b2938 0%,#111c29 48%,#0c141f 100%);
         border:1px solid rgba(110,168,198,.18); border-radius:14px;
         box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 8px 18px rgba(0,0,0,.35);
         min-height:118px; display:flex; flex-direction:column; align-items:center;
         justify-content:center; gap:3px; padding:10px 6px; cursor:pointer;
         text-align:center;
         transition:border-color .15s, box-shadow .15s, transform .06s; }
  .btn::before { content:""; position:absolute; top:0; left:16%; right:16%; height:2px;
                 border-radius:0 0 3px 3px;
                 background:linear-gradient(90deg,transparent,rgba(70,200,230,.55),transparent); }
  .btn .lbl { font-size:17px; font-weight:600; letter-spacing:.3px; line-height:1.25;
              word-break:keep-all; color:#eaf2f9; text-shadow:0 1px 3px rgba(0,0,0,.45); }
  .btn .mode { font-size:10px; color:var(--dim); }
  .btn .key { font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
              font-size:10px; color:var(--accent-2); letter-spacing:1px; margin-top:6px;
              padding:3px 10px; border-radius:999px; max-width:calc(100% - 4px);
              white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
              background:rgba(70,200,230,.10); border:1px solid rgba(70,200,230,.32); }
  .btn:not(.disabled):active, .btn.active {
         border-color:rgba(70,200,230,.75);
         box-shadow:0 0 0 1px rgba(70,200,230,.45), 0 0 24px rgba(70,200,230,.28),
                    inset 0 1px 0 rgba(255,255,255,.06);
         transform:translateY(1px); }
  .btn.active::before { background:linear-gradient(90deg,transparent,rgba(140,235,255,.95),transparent); }
  .btn:disabled { cursor:not-allowed; }
  .btn.disabled { opacity:.5; box-shadow:inset 0 1px 0 rgba(255,255,255,.03), 0 4px 10px rgba(0,0,0,.3); }
  .btn.disabled::before { display:none; }
  .btn.disabled .key { font-family:inherit; letter-spacing:.2px; color:#93a3b2;
                       background:rgba(150,165,180,.08); border-color:rgba(150,165,180,.22); }
  .btn.caution { border-color:rgba(240,168,110,.32); }
  .btn.caution::before { background:linear-gradient(90deg,transparent,rgba(240,168,110,.55),transparent); }
  .btn.caution .lbl { color:#f3cdb2; }
  .btn.caution .key { color:#f0b98d; background:rgba(240,168,110,.10); border-color:rgba(240,168,110,.35); }
  .btn.prominent { border-color:rgba(70,200,230,.45);
                   background:linear-gradient(160deg,#16303f 0%,#10222e 50%,#0c1824 100%); }
  .btn:focus-visible, .tab:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .btn.gray { min-height:40px; font-size:13px; color:var(--dim); flex:1; border-radius:999px;
              background:transparent; border:1px solid rgba(140,165,185,.25); box-shadow:none; }
  .btn.gray::before { display:none; }
  .row { display:flex; gap:8px; padding:0 12px 8px; }
  #log { padding:0 12px 12px; font-size:11px; color:var(--dim);
         max-height:110px; overflow-y:auto; }
  #log div { padding:2px 0; border-bottom:1px solid #111a24; }
  #log .ng { color:#ff6b6b; }
  #pairOverlay { position:fixed; inset:0; background:rgba(4,8,12,.96);
                 display:none; flex-direction:column; align-items:center;
                 justify-content:center; gap:14px; z-index:10; padding:24px; }
  #pairOverlay.show { display:flex; }
  #pairOverlay h2 { font-size:17px; letter-spacing:2px; color:var(--accent-2); margin:0;
                    text-shadow:0 0 14px rgba(70,200,230,.4); }
  #pairOverlay p { font-size:13px; color:var(--dim); text-align:center; margin:0; }
  #pairCode { font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
              font-size:28px; letter-spacing:8px; text-align:center; width:220px;
              padding:10px; background:#0e1620; color:var(--fg);
              border:1px solid rgba(70,200,230,.45); border-radius:12px;
              box-shadow:0 0 24px rgba(70,200,230,.15); }
  #pairGo { padding:12px 44px; font-size:15px; border:none; border-radius:999px;
            background:linear-gradient(180deg,#6fdcf5,#3ab9d8);
            color:#04222c; font-weight:700;
            box-shadow:0 0 18px rgba(70,200,230,.35), inset 0 1px 0 rgba(255,255,255,.35); }
  #pairMsg { font-size:12px; color:#ff6b6b; min-height:16px; }
  @media (min-width:521px) and (max-height:800px) {
    .btn { min-height:92px; }
    #common .btn { min-height:52px; }
    #deckStatus { padding:6px 10px; margin:6px 14px; }
    #pageHeading { padding-top:6px; }
    .group-title { margin-top:12px; }
  }
  #powerTop { position:sticky; top:0; z-index:3;
    background:linear-gradient(180deg,#0f1e2c 0%,#0b1622 100%);
    border-bottom:1px solid rgba(70,200,230,.28);
    padding:12px 14px 14px; box-shadow:0 10px 26px rgba(0,0,0,.55); }
  .power-heading { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px; }
  .power-heading h2 { margin:0; font-size:15px; letter-spacing:2px; font-weight:700;
                      color:#b4e5ec; text-shadow:0 0 12px rgba(70,200,230,.35); }
  #powerHint { font-size:11px; color:var(--dim); }
  #powerControls { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)) 0.8fr; gap:8px; }
  #powerControls .btn { min-height:60px; border-radius:12px;
    background:linear-gradient(160deg,#14293a 0%,#0f1d2c 55%,#0b1521 100%); }
  #powerControls .lbl { font-size:15px; }
  #powerControls [data-id="weapons-increase"] { grid-area:1 / 1; }
  #powerControls [data-id="engine-increase"] { grid-area:1 / 2; }
  #powerControls [data-id="shields-increase"] { grid-area:1 / 3; }
  #powerControls [data-id="weapons-decrease"] { grid-area:2 / 1; }
  #powerControls [data-id="engine-decrease"] { grid-area:2 / 2; }
  #powerControls [data-id="shields-decrease"] { grid-area:2 / 3; }
  #powerControls [data-id="power-reset"] { grid-area:1 / 4 / 3 / 5; }
  @media (max-width:520px) {
    #powerTop { padding:10px 10px; }
    #powerControls { grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; }
    #powerControls .btn { min-height:52px; padding:5px 2px; }
    #powerControls .lbl { font-size:13px; }
    #powerControls .key { font-size:9px; padding:2px 7px; }
    #powerControls [data-id="power-reset"] { grid-area:3 / 1 / 4 / 4; min-height:42px; }
    .power-heading h2 { font-size:14px; } #powerHint { font-size:10px; }
    .group-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
    #common { gap:6px; } #common .lbl { font-size:12px; }
    #common .key { font-size:8px; letter-spacing:.4px; padding:2px 6px; }
    .tab { font-size:12px; padding:10px 2px; }
    #pageHeading { align-items:flex-start; } #pageCount { padding-top:4px; }
    .btn { min-height:100px; } .btn .lbl { font-size:14px; }
  }
  #keyDialog { width:min(850px,calc(100vw - 24px)); max-height:90dvh; padding:0;
    color:var(--fg); background:linear-gradient(180deg,#101c29,#0c141d);
    border:1px solid rgba(90,160,190,.30); border-radius:16px;
    box-shadow:0 24px 60px rgba(0,0,0,.6); }
  #keyDialog::backdrop { background:rgba(2,7,11,.88); }
  .settings-head { display:flex; justify-content:space-between; align-items:center; gap:12px;
                   padding:16px; border-bottom:1px solid rgba(120,170,200,.15); }
  .settings-head h2 { margin:0; font-size:20px; letter-spacing:.5px; }
  .settings-close { background:#172a38; border:1px solid rgba(120,170,200,.2); color:var(--fg);
                    border-radius:999px; padding:8px 14px; cursor:pointer; }
  .settings-note { margin:12px 16px; font-size:12px; color:#9ab0c2; line-height:1.6; }
  .settings-body { display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:0 16px 16px; }
  .settings-body label { font-size:13px; color:#b7c8d5; }
  .settings-body select { width:100%; background:#101f2b; border:1px solid rgba(90,140,170,.35);
                          border-radius:8px; color:var(--fg); padding:10px 8px; font-size:14px; margin:6px 0 12px; }
  #keyList { display:flex; flex-direction:column; gap:6px; max-height:380px; overflow-y:auto; margin-top:10px; }
  #keyList button { text-align:left; padding:10px 12px; border:1px solid rgba(90,140,170,.22);
                    background:#101f2b; border-radius:9px; cursor:pointer; font-size:13px;
                    transition:border-color .15s, background .15s; }
  #keyList button.selected { border-color:rgba(70,200,230,.7); background:#143343;
                             box-shadow:0 0 12px rgba(70,200,230,.18); }
  #keyList small { display:block; font-size:11px; color:#9bb2c5; margin-top:4px; }
  #keyEditor { padding:14px; background:#0a131c; border:1px solid rgba(90,140,170,.25);
               border-radius:12px; align-self:start; }
  #keyEditor h3 { font-size:17px; margin:0 0 8px; }
  #keyCurrent { color:#9bb2c5; font-size:12px; line-height:1.6; margin-bottom:14px; }
  #keyMods { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:8px 0 12px; }
  #keyMods label { background:#142431; border:1px solid rgba(90,140,170,.2);
                   border-radius:7px; padding:8px 3px; font-size:11px; text-align:center; }
  #keyMods input { accent-color:#46c8e6; }
  #keyPreview { font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
                color:#79d3e7; font-size:14px; letter-spacing:1px; min-height:26px; overflow-wrap:anywhere; }
  .settings-actions { display:flex; gap:8px; margin-top:10px; }
  .settings-actions button { flex:1; border:1px solid rgba(90,140,170,.35); background:#173040;
                             border-radius:9px; padding:11px 4px; font-size:13px; cursor:pointer; }
  #keySave { background:linear-gradient(180deg,#6fdcf5,#3ab9d8); color:#04222c;
             border-color:transparent; font-weight:700; }
  .settings-actions button:disabled { opacity:.4; cursor:not-allowed; }
  #keyMessage { font-size:12px; line-height:1.5; color:#e7be91; margin-top:12px; min-height:18px; }
  @media(max-width:600px) {
    #keyDialog { max-height:94dvh; }
    .settings-body { grid-template-columns:1fr; gap:12px; }
    #keyList { max-height:140px; }
    .settings-head { padding:12px 16px; }
    .settings-note { margin-top:8px; margin-bottom:8px; }
  }
</style>
</head>
<body>
<header>
  <h1>SC 컨트롤 덱</h1>
  <span id="focusBadge"></span><button id="settingsOpen" type="button">키 설정</button>
</header>
<section id="powerTop" aria-label="전력 배분 공통 조작">
  <div class="power-heading"><h2>전력 배분</h2><span id="powerHint">무기 · 엔진 · 실드</span></div>
  <div id="powerControls"></div>
</section>
<div id="deckStatus" role="status"></div>
<div id="common" aria-label="공통 바로가기"></div>
<nav id="tabs" aria-label="덱 페이지"></nav>
<section id="pageHeading"><div><h2 id="pageName"></h2><p id="pageDescription"></p></div><span id="pageCount"></span></section>
<main id="grid"></main>
<div class="row">
  <button class="btn gray" id="btnTest" type="button">오버레이 테스트</button>
  <button class="btn gray" id="btnClear" type="button">결과 지우기</button>
</div>
<div style="padding:0 12px 10px;color:#7e93a6;font-size:11px">입력 전용 · 게임 창이 앞에 있을 때만 전송 · 표시 색상은 게임 상태가 아닙니다</div>
<div id="log" aria-live="polite"></div>

<div id="pairOverlay">
  <h2>PC 페어링</h2>
  <p>제어 창에 표시된 6자리 페어링 코드를 입력하세요.<br>코드는 이 기기에만 저장됩니다.</p>
  <input id="pairCode" inputmode="numeric" maxlength="6" autocomplete="off">
  <div id="pairMsg"></div>
  <button id="pairGo">연결</button>
</div>

<dialog id="keyDialog" aria-labelledby="keyTitle">
  <div class="settings-head"><h2 id="keyTitle">덱 키 설정</h2><button class="settings-close" id="keyClose" type="button">닫기</button></div>
  <p class="settings-note">게임의 키 설정은 바꾸지 않습니다. 게임에서 사용하는 키와 맞춰 지정하세요.<br>PC에 저장되며 다른 패드에도 적용됩니다. 이동 키·매크로는 지원하지 않습니다.</p>
  <div class="settings-body">
    <section aria-label="버튼 선택">
      <label for="keySection">버튼 영역</label><select id="keySection"></select>
      <label><input type="checkbox" id="keyUnassigned"> 키 지정 필요한 버튼만</label>
      <div id="keyList" aria-label="설정할 버튼"></div>
    </section>
    <section id="keyEditor" aria-label="키 편집">
      <h3 id="keyButtonName">버튼을 선택하세요</h3><div id="keyCurrent"></div>
      <label for="keyMain">보낼 키</label><select id="keyMain"></select>
      <div id="keyMods" aria-label="조합키 수식자"></div>
      <div id="keyPreview"></div>
      <div class="settings-actions"><button id="keySave" type="button">이 키로 저장</button><button id="keyReset" type="button">XML로 되돌리기</button></div>
      <div id="keyMessage" role="status" aria-live="polite"></div>
    </section>
  </div>
</dialog>

<script>
const S = { code: localStorage.getItem('sc_pair') || '', layout: null,
            page: 0, holds: {}, releases: [] };

function log(msg, ok) {
  const el = document.getElementById('log');
  const d = document.createElement('div');
  if (ok === false) d.className = 'ng';
  d.textContent = new Date().toLocaleTimeString('ko-KR',{hour12:false}) + '  ' + msg;
  el.prepend(d);
  while (el.children.length > 20) el.lastChild.remove();
}

function showPair(msg) {
  document.getElementById('pairOverlay').classList.add('show');
  document.getElementById('pairMsg').textContent = msg || '';
  setTimeout(() => document.getElementById('pairCode').focus(), 50);
}
function hidePair() { document.getElementById('pairOverlay').classList.remove('show'); }

document.getElementById('pairGo').addEventListener('click', async () => {
  const v = document.getElementById('pairCode').value.trim();
  if (!v) return;
  S.code = v;
  const r = await post('/api/auth', null, true);
  if (r === 401) { document.getElementById('pairMsg').textContent = '코드가 맞지 않습니다'; return; }
  if (r === 429) { document.getElementById('pairMsg').textContent = '잠시 차단됨 - 1분 후 다시'; return; }
  if (r !== 200) { document.getElementById('pairMsg').textContent = 'PC에 연결하지 못했습니다'; return; }
  localStorage.setItem('sc_pair', v);
  hidePair();
  log('페어링 완료', true);
});
document.getElementById('pairCode').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('pairGo').click();
});

async function post(path, body, quiet) {
  try {
    const r = await fetch(path, {method: body === null ? 'GET' : 'POST',
      headers: {'Content-Type': 'application/json', 'X-Pairing-Code': S.code},
      body: body === null ? undefined : JSON.stringify(body)});
    if (r.status === 401) { showPair('코드를 입력하세요'); return 401; }
    if (r.status === 429) { if (!quiet) log('잠시 차단됨 (1분)', false); return 429; }
    const j = await r.json().catch(() => ({}));
    if (r.status === 409 || j.error === 'game_not_focused') {
      flashFocus();
      if (!quiet) log('게임 창이 앞에 없음', false);
      return 409;
    }
    if (!quiet) log(j.msg || (r.ok ? '전송됨' : '실패'), r.ok && j.ok !== false);
    return r.ok ? 200 : r.status;
  } catch (e) {
    if (!quiet) log('PC 연결 실패', false);
    return 0;
  }
}

let focusTimer = null;
function flashFocus() {
  const b = document.getElementById('focusBadge');
  b.textContent = '게임이 앞에 없음';
  b.className = 'off';
  clearTimeout(focusTimer);
  focusTimer = setTimeout(() => { b.textContent = ''; b.className = ''; }, 3000);
}

function sendInput(type, key, ms) {
  return post('/api/input', {type, key, ms: ms || 0});
}

function render() {
  S.releases.forEach(fn => window.removeEventListener('deckrelease', fn));
  S.releases = [];
  const L = S.layout;
  const pages = L.pages || [];
  if (S.page >= pages.length) S.page = 0;
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  pages.forEach((p, i) => {
    const t = document.createElement('button');
    t.type = 'button';
    t.className = 'tab' + (i === S.page ? ' on' : '');
    t.textContent = p.name || ('페이지 ' + (i + 1));
    t.addEventListener('click', () => { releaseAll(); S.page = i; render(); });
    tabs.appendChild(t);
  });
  const page = pages[S.page] || {buttons:[]};
  document.getElementById('pageName').textContent = page.name || '';
  document.getElementById('pageDescription').textContent = page.description || '';
  document.getElementById('pageCount').textContent = page.buttons.filter(b => !b.unbound && b.keys).length + ' / ' + page.buttons.length + ' 연결';
  const status = document.getElementById('deckStatus');
  status.className = L.actionmaps_active ? 'ready' : '';
  status.textContent = L.actionmaps_active ? '키 연결 · XML / 사용자 지정 표기를 확인하세요. 중복·미지정 키는 입력하지 않습니다.' : 'PC에서 XML을 선택하거나 상단 키 설정에서 지정하세요. 미지정 버튼은 잠깁니다. ESC는 고정 키입니다.';
  if (L.migration_notice) status.textContent += ' · ' + L.migration_notice;
  const powerControls = document.getElementById('powerControls');
  powerControls.replaceChildren();
  (L.power_buttons || []).forEach(b => powerControls.appendChild(makeButton(b)));
  const connected = (L.power_buttons || []).filter(b => !b.unbound && b.keys).length;
  document.getElementById('powerHint').textContent = connected + ' / ' + (L.power_buttons || []).length + ' 키 연결 · 상태 표시 아님';
  const common = document.getElementById('common');
  common.replaceChildren();
  (L.common_buttons || []).forEach(b => common.appendChild(makeButton(b)));
  const grid = document.getElementById('grid');
  grid.replaceChildren();
  grid.className = page.id === 'power' ? 'power' : '';
  const groups = new Map();
  page.buttons.forEach(b => {
    const name = b.group || '버튼';
    if (!groups.has(name)) groups.set(name, []);
    groups.get(name).push(b);
  });
  groups.forEach((buttons, name) => {
    const group = document.createElement('section');
    group.className = 'group' + (buttons.some(b => b.caution) ? ' caution-zone' : '');
    const title = document.createElement('h3');
    title.className = 'group-title'; title.textContent = name;
    const cells = document.createElement('div'); cells.className = 'group-grid';
    buttons.forEach(b => cells.appendChild(makeButton(b)));
    group.append(title, cells); grid.appendChild(group);
  });
}

function makeButton(b) {
  const el = document.createElement('button');
  el.type = 'button'; el.dataset.id = b.id || '';
  el.className = 'btn' + (b.caution ? ' caution' : '') + (b.prominent ? ' prominent' : '');
  const label = document.createElement('span'); label.className = 'lbl'; label.textContent = b.label;
  const key = document.createElement('span'); key.className = 'key';
  el.append(label, key);
  if (b.unbound || !b.keys) {
    el.classList.add('disabled'); el.disabled = true;
    key.textContent = b.disabled_reason || b.blocked_reason || '키 지정 필요';
  } else {
    key.textContent = b.keys.toUpperCase() + (b.keys_source === 'fixed' ? ' · 고정' : b.keys_source === 'override' ? ' · 사용자' : ' · XML');
    if (b.mode === 'hold') {
      const hint = document.createElement('span'); hint.className = 'mode';
      hint.textContent = '누르는 동안만'; el.appendChild(hint);
    }
    bindButton(el, b);
  }
  return el;
}

function bindButton(el, b) {
  const key = b.keys, mode = b.mode || 'tap';
  let holdTimer = null, holding = false;
  const release = () => {
    if (!holding) return;
    holding = false;
    clearInterval(holdTimer);
    el.classList.remove('active');
    delete S.holds[key];
    sendInput('up', key).then(() => {});
  };
  window.addEventListener('deckrelease', release);
  S.releases.push(release);
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (holding) return;
    el.setPointerCapture(e.pointerId);
    el.classList.add('active');
    if (mode === 'hold') {
      holding = true;
      S.holds[key] = true;
      sendInput('down', key);
      holdTimer = setInterval(() => sendInput('refresh', key), 2000);
    } else if (mode === 'timed') {
      sendInput('timed', key, b.ms || 1000);
      setTimeout(() => el.classList.remove('active'), Math.min(b.ms || 1000, 1500));
    } else {
      sendInput('press', key);
      setTimeout(() => el.classList.remove('active'), 130);
    }
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev =>
    el.addEventListener(ev, release));
}

const K = {layout:null, selected:null, busy:false};
const keyDialog = document.getElementById('keyDialog');
function settingGroups() {
  const l = K.layout;
  return [{name:'최상단 전력 배분',buttons:l.power_buttons || []},
    {name:'공통 바로가기',buttons:l.common_buttons || []}, ...(l.pages || [])];
}
function sourceLabel(b) {
  if (b.unbound || !b.keys) return b.disabled_reason || '키 지정 필요';
  return b.keys.toUpperCase() + (b.keys_source === 'override' ? ' · 사용자 지정' : b.keys_source === 'fixed' ? ' · 고정 키' : ' · XML');
}
function drawKeyList() {
  const list = document.getElementById('keyList'); list.replaceChildren();
  const group = settingGroups()[Number(document.getElementById('keySection').value) || 0];
  const buttons = (group.buttons || []).filter(b => !document.getElementById('keyUnassigned').checked || b.unbound || !b.keys);
  if (!buttons.some(b => b.id === K.selected)) K.selected = buttons[0]?.id || null;
  buttons.forEach(b => {
    const row = document.createElement('button');row.type='button';
    row.className = b.id === K.selected ? 'selected' : '';
    row.dataset.settingId = b.id;
    row.textContent=b.label;
    const status=document.createElement('small');status.textContent=sourceLabel(b);row.appendChild(status);
    row.onclick=()=>{if(K.busy)return;K.selected=b.id;drawKeyList();};list.appendChild(row);
  });
  if (!buttons.length) list.textContent='해당 버튼이 없습니다';
  drawKeyEditor();
}
function selectedSetting() {
  return settingGroups().flatMap(g=>g.buttons || []).find(b=>b.id===K.selected);
}
function previewSettingKey() {
  const parts = [...document.querySelectorAll('#keyMods input:checked')].map(e=>e.value);
  if(document.getElementById('keyMain').value) parts.push(document.getElementById('keyMain').value);
  const value=parts.join('+');document.getElementById('keyPreview').textContent=value.toUpperCase() || '키를 선택하세요';return value;
}
function drawKeyEditor() {
  const b=selectedSetting();
  document.getElementById('keyButtonName').textContent=b?.label || '버튼을 선택하세요';
  document.getElementById('keyCurrent').textContent=b ? '현재: '+sourceLabel(b) : '';
  document.getElementById('keyMessage').textContent=b?.blocked_reason || '';
  const locked=!b || !b.action || !!b.blocked_reason;
  const parts=(b?.override_keys || b?.keys || '').split('+');const main=parts.pop();
  document.getElementById('keyMain').value=main || '';
  document.querySelectorAll('#keyMods input').forEach(e=>{e.checked=parts.includes(e.value);e.disabled=locked;});
  document.getElementById('keyMain').disabled=locked;
  document.getElementById('keySave').disabled=locked;
  document.getElementById('keyReset').disabled=locked || !b?.override_keys;
  previewSettingKey();
}
async function openKeySettings() {
  releaseAll();
  try {
    const r=await fetch('/api/key-settings',{headers:{'X-Pairing-Code':S.code}});
    if(r.status===401){showPair('키 설정 전에 페어링하세요');return;}
    if(!r.ok)throw new Error();
    K.layout=await r.json();K.selected=null;
    const section=document.getElementById('keySection');section.replaceChildren();
    settingGroups().forEach((g,i)=>{const o=document.createElement('option');o.value=i;o.textContent=g.name;section.appendChild(o);});
    drawKeyList();keyDialog.showModal();
  } catch(e){log('키 설정을 불러오지 못했습니다',false);}
}
async function saveSetting(reset) {
  if(K.busy)return;const b=selectedSetting();if(!b)return;
  const key=reset ? '' : previewSettingKey();
  if(!reset && !document.getElementById('keyMain').value){document.getElementById('keyMessage').textContent='보낼 키를 선택하세요';return;}
  K.busy=true;document.getElementById('keySection').disabled=true;document.getElementById('keyUnassigned').disabled=true;document.getElementById('keySave').disabled=true;document.getElementById('keyReset').disabled=true;
  try {
    const r=await fetch('/api/key-settings',{method:'POST',headers:{'Content-Type':'application/json','X-Pairing-Code':S.code},body:JSON.stringify({button_id:b.id,keys:key})});
    const j=await r.json();
    if(!r.ok){if(r.status===401){keyDialog.close();showPair('다시 페어링하세요');}throw new Error(j.msg || '저장 실패');}
    releaseAll();K.layout=j.layout;S.layout=j.layout;render();drawKeyList();
    document.getElementById('keyMessage').textContent=reset ? '사용자 지정을 지웠습니다. XML에 없으면 잠금 상태입니다.' : 'PC에 저장했습니다. 게임의 실제 키와 맞는지 확인하세요.';
  } catch(e){document.getElementById('keyMessage').textContent=e.message || 'PC 연결 실패';}
  finally {K.busy=false;document.getElementById('keySection').disabled=false;document.getElementById('keyUnassigned').disabled=false;const b=selectedSetting();const locked=!b || !b.action || !!b.blocked_reason;document.getElementById('keySave').disabled=locked;document.getElementById('keyReset').disabled=locked || !b?.override_keys;}
}
const mainKeys=['',...Array.from({length:12},(_,i)=>'f'+(i+1)),...'0123456789',...'bcfghijklmnoprtuvxyz',
 'tab','enter','esc','backspace','delete','insert','home','end','pageup','pagedown','minus','equal','lbracket','rbracket','semicolon','apostrophe','comma','period','slash','backslash','backquote',
 ...Array.from({length:10},(_,i)=>'np_'+i),'np_add','np_subtract','np_multiply','np_divide','np_period','mouse1','mouse2','mouse3','mwheel_up','mwheel_down'];
mainKeys.forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k.toUpperCase() || '키 선택';document.getElementById('keyMain').appendChild(o);});
['lctrl','rctrl','lalt','ralt','lshift','rshift'].forEach(k=>{const label=document.createElement('label');const cb=document.createElement('input');cb.type='checkbox';cb.value=k;cb.onchange=previewSettingKey;label.append(cb,document.createTextNode(k.toUpperCase()));document.getElementById('keyMods').appendChild(label);});
document.getElementById('settingsOpen').onclick=openKeySettings;
document.getElementById('keyClose').onclick=()=>{if(!K.busy)keyDialog.close();};
keyDialog.addEventListener('cancel',e=>{if(K.busy)e.preventDefault();});
document.getElementById('keySection').onchange=()=>{if(K.busy)return;K.selected=null;drawKeyList();};
document.getElementById('keyUnassigned').onchange=drawKeyList;
document.getElementById('keyMain').onchange=previewSettingKey;
document.getElementById('keySave').onclick=()=>saveSetting(false);
document.getElementById('keyReset').onclick=()=>saveSetting(true);

document.getElementById('btnTest').addEventListener('click', async () => {
  const rs = prompt('테스트 RS 값 (예: 6340)');
  if (!rs) return;
  await post('/api/test', {rs: parseInt(rs)});
});
document.getElementById('btnClear').addEventListener('click', async () => {
  await post('/api/clear', {});
});

function releaseAll() {
  window.dispatchEvent(new Event('deckrelease'));
}
window.addEventListener('pagehide', releaseAll);
window.addEventListener('blur', releaseAll);
document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });
document.addEventListener('contextmenu', e => e.preventDefault());

(async function init() {
  try {
    const r = await fetch('/api/layout');
    if (r.ok) S.layout = await r.json();
  } catch (e) {}
  if (!S.layout || !S.layout.pages || !S.layout.pages.length) {
    document.getElementById('grid').innerHTML =
      '<div style="color:#7e93a6;padding:20px">레이아웃을 불러오지 못했습니다. PC에서 덱 설정 파일을 확인하세요.</div>';
    return;
  }
  render();
  const a = await post('/api/auth', null, true);
  if (a !== 200) showPair('PC 제어 창의 페어링 코드를 입력하세요');
})();
</script>
