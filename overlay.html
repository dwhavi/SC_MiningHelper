<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SC 광물 오버레이</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: rgba(10, 14, 20, 0.72);
    color: #e8eef5;
    font-family: "Malgun Gothic", "Segoe UI", sans-serif;
    font-size: 15px;
    padding: 10px 12px;
    min-height: 100vh;
  }
  .rs-line { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .rs { font-size: 26px; font-weight: 700; letter-spacing: 1px; }
  .main-min { font-size: 17px; font-weight: 600; }
  .corrected { color: #f5c542; font-size: 12px; }
  .idle { color: #8a97a5; padding: 6px 0; }
  table { width: 100%; margin-top: 8px; border-collapse: collapse; }
  td { padding: 3px 4px; vertical-align: middle; }
  .bar-wrap { background: #232c38; border-radius: 3px; height: 10px; width: 100%; }
  .bar { height: 10px; border-radius: 3px; }
  .pct { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .inert td { color: #8a97a5; }
  .verdict { margin-top: 10px; padding: 7px 9px; border-radius: 6px; font-weight: 600; }
  .v-ok { background: rgba(46, 160, 67, 0.25); color: #7ee2a0; }
  .v-hard { background: rgba(210, 153, 34, 0.25); color: #f5c542; }
  .v-infeasible { background: rgba(218, 54, 51, 0.28); color: #ff8f8a; }
  .v-unknown { background: rgba(110, 118, 129, 0.25); color: #aab4c0; }
  .reason { font-weight: 400; font-size: 13px; margin-top: 3px; opacity: 0.9; }
  .beta { font-size: 10px; border: 1px solid currentColor; border-radius: 3px;
          padding: 0 4px; margin-left: 6px; vertical-align: middle; }
  .chips { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { background: #1c2531; border-radius: 4px; padding: 2px 8px; font-size: 12px; }
  footer { margin-top: 10px; font-size: 11px; color: #6c7885;
           display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  #testbox { margin-top: 10px; border-top: 1px solid #2a3542; padding-top: 8px;
             display: none; }
  #testbox.open { display: block; }
  #testbox input { background: #141b24; color: #e8eef5; border: 1px solid #2a3542;
                   border-radius: 4px; padding: 4px 6px; width: 110px; }
  #testbox button { background: #1f6feb; border: 0; color: #fff; border-radius: 4px;
                    padding: 4px 10px; cursor: pointer; margin-left: 4px; }
  #toggle-test { background: none; border: 0; color: #6c7885; font-size: 11px;
                 cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
  <div id="app">
    <div class="rs-line">
      <span class="rs" id="rs">--</span>
      <span class="main-min" id="mainmin"></span>
      <span class="corrected" id="corrected"></span>
    </div>
    <div class="idle" id="idle">스캔 대기 중</div>
    <table id="comp" style="display:none"><tbody></tbody></table>
    <div id="verdict"></div>
    <div class="chips" id="chips"></div>
    <footer>
      <span id="equip"></span>
      <span id="updated"></span>
      <button id="toggle-test">테스트 모드</button>
    </footer>
    <div id="testbox">
      RS 직접 입력:
      <input id="trs" type="number" placeholder="예: 6340">
      <button onclick="sendTest()">적용</button>
      <button onclick="sampleRock()">샘플 바위</button>
      <button onclick="clearAll()">지우기</button>
    </div>
  </div>
<script>
const COLORS = {
  Quantainium: "#b16dff", Stileron: "#4dd0e1", Savrilium: "#7c4dff",
  Ouratite: "#ff8a65", Riccite: "#4db6ac", Lindinium: "#7986cb",
  Beryl: "#81c784", Taranite: "#ffb74d", Borase: "#90a4ae",
  Gold: "#ffd54f", Bexalite: "#e57373", Laranite: "#f06292",
  Agricium: "#64b5f6", Aslarite: "#a1887f", Titanium: "#b0bec5",
  Tungsten: "#8d6e63", Hephaestanite: "#dce775", Quartz: "#f8bbd0",
  Corundum: "#ef9a9a", Copper: "#ffab91", Silicon: "#c5e1a5",
  Iron: "#bcaaa4", Aluminum: "#cfd8dc", Tin: "#d7ccc8", Ice: "#b3e5fc",
  Torite: "#ce93d8"
};
const ICON = {ok: "\u26CF 가능", hard: "\u26A0 어려움",
              infeasible: "\u274C 불가", unknown: "\u2753 보류"};
const TIER_ICON = {high: "\u26A0", mid: "\u25CB", low: "\u2713", unknown: "\u2753"};

async function refresh() {
  try {
    const s = await (await fetch("/api/state")).json();
    render(s);
  } catch (e) { /* 서버 재시작 중 등 */ }
}

function render(s) {
  document.getElementById("rs").textContent = s.rs ?? "--";
  const idle = document.getElementById("idle");
  const comp = document.getElementById("comp");
  const tb = comp.querySelector("tbody");
  tb.innerHTML = "";
  document.getElementById("corrected").textContent = "";
  document.getElementById("mainmin").textContent = "";

  const hasComp = s.composition && s.composition.length > 0;
  const hasMatch = s.matches && s.matches.length > 0;
  idle.style.display = (hasComp || hasMatch) ? "none" : "block";
  if (!hasComp && !hasMatch) idle.textContent =
    s.phase === "idle" ? "스캔 대기 중" : "스캔 읽는 중...";

  if (hasMatch) {
    const m = s.matches[0];
    document.getElementById("mainmin").textContent =
      `\u2192 ${m.mineral} \u00D7${m.count} ${TIER_ICON[m.difficulty] ?? ""} ${m.difficulty_label ?? ""}`;
    if (m.corrected)
      document.getElementById("corrected").textContent =
        `OCR 보정: ${m.assumed_rs}로 추정`;
    if (s.matches.length > 1)
      document.getElementById("corrected").textContent =
        "후보 여러 개: " + s.matches.map(x => `${x.mineral}\u00D7${x.count}`).join(", ");
  }

  if (hasComp) {
    comp.style.display = "table";
    for (const m of s.composition) {
      const color = COLORS[m.name] ?? "#9fb2c8";
      tb.insertAdjacentHTML("beforeend",
        `<tr><td style="white-space:nowrap">${m.name}</td>
         <td class="pct">${m.pct.toFixed(1)}%</td>
         <td style="width:45%"><div class="bar-wrap">
           <div class="bar" style="width:${Math.min(m.pct,100)}%;background:${color}"></div>
         </div></td></tr>`);
    }
    if (s.inert_pct != null)
      tb.insertAdjacentHTML("beforeend",
        `<tr class="inert"><td>Inert</td><td class="pct">${s.inert_pct.toFixed(1)}%</td>
         <td style="width:45%"><div class="bar-wrap">
           <div class="bar" style="width:${Math.min(s.inert_pct,100)}%;background:#5a6672"></div>
         </div></td></tr>`);
  } else comp.style.display = "none";

  const v = document.getElementById("verdict");
  if (s.rock_verdict) {
    const rv = s.rock_verdict;
    v.className = "verdict v-" + rv.level;
    v.innerHTML = `\u26CF 바위 판정: ${ICON[rv.level] ?? rv.label}` +
      (rv.beta ? '<span class="beta">BETA</span>' : "") +
      `<div class="reason">${rv.reason ?? ""}</div>`;
    v.style.display = "block";
  } else v.style.display = "none";

  const chips = [];
  if (s.resistance_pct != null) chips.push(`저항 ${s.resistance_pct}%`);
  if (s.instability != null) chips.push(`불안정 ${s.instability}`);
  if (s.mass != null) chips.push(`질량 ${s.mass}`);
  document.getElementById("chips").innerHTML =
    chips.map(c => `<span class="chip">${c}</span>`).join("");

  document.getElementById("equip").textContent = s.equipment_name ?? "";
  document.getElementById("updated").textContent = s.updated_at ?? "";
}

async function sendTest() {
  const rs = parseInt(document.getElementById("trs").value);
  if (!rs) return;
  await fetch("/api/test", {method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({rs})});
  refresh();
}
async function sampleRock() {
  await fetch("/api/test", {method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({rs: 6340, resistance_pct: 62, instability: 1000,
      mass: 5123,
      minerals: [{name: "Quantainium", pct: 41.2},
                 {name: "Bexalite", pct: 8.7}, {name: "Gold", pct: 3.1}]})});
  refresh();
}
async function clearAll() {
  await fetch("/api/clear", {method: "POST"});
  refresh();
}
document.getElementById("toggle-test").onclick = () =>
  document.getElementById("testbox").classList.toggle("open");

try {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = (ev) => render(JSON.parse(ev.data));
} catch (e) {}
setInterval(refresh, 2000);
refresh();
</script>
</body>
</html>
