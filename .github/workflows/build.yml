name: build-exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build one-file exe
        run: |
          pyinstaller --noconfirm --onefile --noconsole --name SC_PadControl `
            --collect-all rapidocr_onnxruntime --collect-all onnxruntime `
            --collect-all customtkinter `
            --add-data "signatures.json;." --add-data "minerals.json;." `
            --add-data "equipment.json;." --add-data "config.json;." `
            --add-data "control_deck.html;." --add-data "deck_layout.json;." sc_pad_control.py

      - name: Smoke test the exe on Windows
        shell: pwsh
        run: |
          Start-Process .\dist\SC_PadControl.exe
          Start-Sleep -Seconds 30
          try {
            $r = Invoke-WebRequest http://localhost:8377/ -UseBasicParsing
            if ($r.StatusCode -ne 200) { throw "control deck page returned $($r.StatusCode)" }
            $l = Invoke-WebRequest http://localhost:8377/api/layout -UseBasicParsing
            if ($l.StatusCode -ne 200) { throw "layout returned $($l.StatusCode)" }
            Write-Host "smoke OK, deck $($r.StatusCode), layout $($l.StatusCode)"
          } finally {
            Get-Process SC_PadControl -ErrorAction SilentlyContinue | Stop-Process -Force
          }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.${{ github.run_number }}
          name: SC_PadControl v0.${{ github.run_number }}
          files: dist/SC_PadControl.exe
          generate_release_notes: true
