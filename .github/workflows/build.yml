name: build-exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build one-file exe
        run: |
          pyinstaller --noconfirm --onefile --noconsole --name SCMiningHelper `
            --icon icon.ico `
            --collect-all rapidocr_onnxruntime --collect-all onnxruntime `
            --collect-all customtkinter `
            --add-data "signatures.json;." --add-data "minerals.json;." `
            --add-data "equipment.json;." --add-data "config.json;." `
            --add-data "overlay.html;." --add-data "calibrate.html;." `
            --add-data "icon.png;." scm_helper.py

      - name: Smoke test the exe on Windows
        shell: pwsh
        run: |
          Start-Process .\dist\SCMiningHelper.exe
          Start-Sleep -Seconds 30
          try {
            $r = Invoke-RestMethod http://localhost:8377/api/state
            if ($null -eq $r.phase) { throw "state endpoint returned no phase" }
            Write-Host "smoke OK, phase=$($r.phase)"
          } finally {
            Get-Process SCMiningHelper -ErrorAction SilentlyContinue | Stop-Process -Force
          }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.${{ github.run_number }}
          name: SCMiningHelper v0.${{ github.run_number }}
          files: dist/SCMiningHelper.exe
          generate_release_notes: true
